name: Promote Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # 🔍 Descobrir release branch
      - name: Find release branch
        run: |
          BRANCH="release/${VERSION}"
          git fetch origin

          if ! git show-ref --verify --quiet refs/remotes/origin/$BRANCH; then
            echo "❌ Branch $BRANCH não encontrada"
            exit 1
          fi

          echo "RELEASE_BRANCH=$BRANCH" >> $GITHUB_ENV

      # 🔀 Merge automático → main
      - name: Merge release into main
        run: |
          git checkout main
          git pull origin main

          git merge origin/${RELEASE_BRANCH} \
            --no-ff \
            -m "chore: merge ${RELEASE_BRANCH} into main [release ${TAG}]"

          git push origin main

      # 🔎 Encontrar RC
      - name: Find matching RC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RC_TAG=$(gh release list \
            --json tagName,name,isDraft \
            --jq ".[] | select(.isDraft==true and (.name | contains(\"$TAG\"))) | .tagName" \
            | head -n 1)

          if [ -z "$RC_TAG" ]; then
            echo "❌ Nenhum RC encontrado"
            exit 1
          fi

          echo "RC_TAG=$RC_TAG" >> $GITHUB_ENV

      # 🚀 Promover release
      - name: Promote RC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RC_TAG" \
            --tag "$TAG" \
            --title "Release $TAG" \
            --draft=false \
            --prerelease=false

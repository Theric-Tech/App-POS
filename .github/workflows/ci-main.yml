name: CI - Main Validation

on:
  push:
    branches: [ main ]

jobs:
  validate-main:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: chmod +x ./gradlew

      - run: ./gradlew testDebugUnitTest
      - run: ./gradlew lint
      - run: ./gradlew assembleRelease
